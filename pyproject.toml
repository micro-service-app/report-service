[project]
name = "report-service"
version = "0.1.0"
description = "Reporting read model for Multi-ERP, built from domain events"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.163.0",
    "httpx>=0.28.1",
    "aio-pika>=9.5.5",
    "pymongo>=4.20.0",
    "tzdata>=2026.6",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
